version: '3.8'
services:
  fastapi:
    build:
      context: ..    
      dockerfile: docker/dockerfile
    restart: always
    container_name: fastapi
    expose:
      - "8000"
    volumes:
      - ../app:/code/app
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
  nginx:
      image: nginx:alpine
      restart: always
      container_name: nginx-proxy
      ports:
        - "80:80"
        - "443:443"  # For SSL
      volumes:
        - ../nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
        - nginx-logs:/var/log/nginx
        # Uncomment for SSL certificates
        # - ./ssl:/etc/nginx/ssl:ro
      depends_on:
        - fastapi
      networks:
        - app-network
      healthcheck:
        test: ["CMD", "nginx", "-t"]
        interval: 30s
        timeout: 10s
        retries: 3

networks:
    app-network:
      driver: bridge

volumes:
    nginx-logs:

